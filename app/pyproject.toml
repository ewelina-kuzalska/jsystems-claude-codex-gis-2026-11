[project]
name = "map-qa"
version = "0.1.0"
description = "Map QA: kontrola atrybutów dróg Krakowa (OSM, Overture, zdjęcia, znaki B-33)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "geopandas==1.2.0",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "pyarrow==23.0.1",
    "pillow==12.0.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "typer==0.27.3",
]

[project.scripts]
map-qa = "map_qa.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-httpx==0.36.2",
    "pytest-recording==0.14.1",
    "syrupy==6.1.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/map_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--block-network -m 'not live_api' -ra"
markers = [
    "live_api: wywołuje prawdziwe endpointy OpenRouter (ADR-006 D-604); uruchamiaj: uv run pytest -m live_api -p no:recording",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
